<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar</title>
    <link rel="stylesheet" href="criar.css">
    <link rel="shortcut icon" href="../imagens/favicon.jpeg" type="image/x-icon">
</head>
<body>
<div id="wrapper">

<!-- Main -->
    <div id="main">
        <div class="inner">
        <!-- Header -->
            <header style="margin-bottom: 40px;" id="header">
                <a class="logo"><strong>Simoldes</strong></a>
            </header >

            <div class="container">
                <div class="form-container">
                    <h2>Cadastrar nova peça</h2>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="nome">Molde</label>
                        <input type="text" id="nome" name="nome" required />
                    </div>
            
                    <div class="form-group">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" step="0.01" id="preco" name="preco" required />
                    </div>
            
                    <div class="form-group">
                        <label for="quantidade">Referência</label>
                        <input type="number" id="quantidade" name="quantidade" required />
                    </div>
            
                    <div class="form-group">
                        <button type="submit">Cadastrar Peça</button>
                    </div>
                </form>
                </div>
            </div>
        </div>
    </div>

<!-- Sidebar -->
    <div id="sidebar">
        <div class="inner">
        <!-- Menu -->
            <nav id="menu">
                <h1 class="title-2"><a href="../Dashboard/dash.html">Home</a></h1>
                <ul>
                    <li><a href="../Excluir/excluir.html">Excluir peça</a></li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
